### Services [ services ]
services:
  title: "What I Do"
  subtitle: "my <b>Services</b>"
  bg_title: "Services"

  items:
    - title: "Web & App Security" # 1. 첫 번째 보안 카드
      subtitle: "모의해킹 및 취약점 진단"
      text: "DVWA, WebGoat 실습을 통한 웹 취약점 분석 경험을 바탕으로 주요 보안 오류를 진단합니다. PureQR 앱 개발을 토대로 모바일 클라이언트와 API 서버 간의 안전한 데이터 통신 구조를 설계합니다."
      button_label: "See Projects"
      button_link: "#portfolio-section"

    - title: "Network Infrastructure" # 2. 두 번째 보안 카드
      subtitle: "보안 인프라 구축 및 관제"
      text: "VMware 환경에서 OPNsense 방화벽을 활용하여 외부망과 DMZ, 내부망을 분리하는 네트워크 아키텍처를 설계합니다. NAT/DNAT 라우팅 규칙 수립 및 방화벽 정책 제어를 통해 인프라를 보호합니다."
      button_label: "See Projects"
      button_link: "#portfolio-section"

    - title: "Vulnerability Research" # 3. 세 번째 보안 카드
      subtitle: "최신 CVE 취약점 분석"
      text: "React2Shell(CVE-2025-55182)과 같은 최신 위협 취약점의 Exploit 메커니즘을 추적하고 원인을 정밀 분석합니다. 발견된 보안 결함에 대한 패치 방안 및 시큐어 코딩 대응 전략을 수립합니다."
      button_label: "See Projects"
      button_link: "#portfolio-section"

### Skills [ skills ]
skills:
  title: "Professional Skills"
  subtitle: "my <b>Talent</b>"
  bg_title: "Skills"

  column1:
    items:
      - label: "Python" #0-10 progress in dots
        text: "기본 함수 및 자료구조를 이해하고 있으며, 다양한 데이터 처리 작업에 Python을 활용할 수 있습니다. flask를 이용해 간단한 웹 서버를 직접 구축해본 경험이 있습니다. 또한, 파일 입출력, 예외 처리, 리스트 컴프리헨션 등 실무에 필요한 다양한 기능을 활용할 수 있습니다"
        value: "64" #0-100 progress in %

      - label: "PowerPoint" #0-10 progress in dots
        text: "표 또는 그래프를 활용한 발표자료 제작이 가능합니다. 청중의 이해를 돕는 시각적 요소와 애니메이션 효과를 효과적으로 적용할 수 있습니다. 다양한 템플릿을 활용해 목적에 맞는 프레젠테이션을 구성한 경험이 있습니다."
        value: "55" #0-100 progress in %

  column2:
    items:
      - label: "Network Security" #0-10 progress in dots
        text: "VMware 환경에서 OPNsense 방화벽을 교차 세팅하고 NAT/DNAT 라우팅 규칙을 직접 설계해 보았습니다. 인프라 간의 통신 흐름을 제어하고 보안 관점에서의 서브네팅 및 네트워크 게이트웨이 트러블슈팅이 가능합니다."
        value: "65" #0-100 progress in %

      - label: "html" #0-10 progress in dots
        text: "HTML의 기본 구조를 이해하고 있으며, 시맨틱 태그를 활용해 웹 페이지의 가독성과 접근성을 높일 수 있습니다. 오픈 차트 그래프 등 시각화 요소를 직접 구현해본 경험이 있습니다. CSS와 연동하여 다양한 스타일링 작업도 수행할 수 있습니다."
        value: "60" #0-100 progress in %

  column3:
    items:
      - label: "Railway Cloud" #0-10 progress in dots
        text: "PureQR 프로젝트의 Flask 백엔드 API와 PostgreSQL 데이터베이스를 Railway 클라우드 플랫폼에 성공적으로 마이그레이션 및 배포하여 운영했습니다. 클라이언트-클라우드 간의 안정적인 데이터 연동 인프라 관리가 가능합니다."
        value: "80" #0-100 progress in %

      - label: "Web Pentesting" #0-10 progress in dots
        text: "DVWA 및 WebGoat와 같은 웹 취약점 진단 환경을 통해 SQL Injection, XSS, XPath Injection 등의 공격 메커니즘을 분석하고 실습했습니다. 취약점을 탐지하고 이에 대한 안전한 시큐어 코딩 패치 방향을 이해하고 있습니다."
        value: "70" #0-100 progress in %

